[build]
builder = "DOCKERFILE"
dockerfilePath = "src/backend/Dockerfile"

[deploy]
# healthcheckPath gates DEPLOY CUTOVER ONLY — Railway does not monitor it
# after a deployment goes live and never restarts a live-but-hung container
# ("not used for continuous monitoring" — Railway docs; disproven-the-hard-way
# 2026-08-10, see docs/incidents/2026-08-10-postgres-container-freeze-backend-wedge.md).
# Runtime liveness is owned in-process by api/services/db_watchdog.py, whose
# non-zero exit engages restartPolicyType ON_FAILURE.
#
# /health/worker 503s when either worker stream is stale, blocking cutover
# to a build whose worker can't start. Timeout matches the 600s boot
# connectivity-retry budget (DB_BOOT_CONNECT_RETRY_SECONDS) so a deploy
# during a short DB blip can still ride it out.
healthcheckPath = "/health/worker"
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
# Sized to outlast a multi-hour DB outage: while the DB is down each restart
# cycle lasts ~6 min (watchdog failure window) to ~10 min (boot retry
# budget), so 50 retries covers roughly 5-8 hours before Railway gives up.
# Paid plans allow more than the default 10.
restartPolicyMaxRetries = 50
