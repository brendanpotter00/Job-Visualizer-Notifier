name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job carries a timeout-minutes, about 2-3x its slowest recent run,
# so a stuck job fails in minutes instead of holding its check for
# GitHub's 6-hour default. On PR #393 a Scraper Scripts runner stopped
# responding mid-pytest (it ignored a normal cancel and saved no log) and
# held the check for 24 minutes until it was force-cancelled.
jobs:
  # The frontend is split into one lint/type/build job and parallel test
  # shards. Before the split one job ran everything in series and the Vitest
  # suite alone took 4-7 minutes.
  frontend-checks:
    name: Frontend checks
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx -w src/frontend eslint src --max-warnings 149

      - run: npm run type-check

      # `npm run build` is `tsc && vite build`, and the step above already ran
      # tsc, so only the bundle step runs here.
      - run: npx -w src/frontend vite build

  frontend-tests:
    name: Frontend tests (${{ matrix.shard }}/${{ strategy.job-total }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      # Let every shard finish so one run reports every failing file.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Straight to the workspace script. The root `npm test` hops through a
      # second `npm run`, which swallows everything after `--` as npm flags, so
      # Vitest never saw `--shard` and every shard would run the whole suite.
      - run: npm test -w src/frontend -- --run --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  backend:
    name: Backend API
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobscraper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            src/backend/api/requirements.txt
            src/backend/api/requirements-dev.txt

      - run: pip install -r src/backend/api/requirements.txt -r src/backend/api/requirements-dev.txt

      - run: cd src/backend && mypy

      # pytest-xdist: one worker per vCPU, a file never split across workers
      # (module-scoped fixtures own a schema each), and each worker on its own
      # database (see _use_worker_database in api/tests/conftest.py). An explicit
      # 4 (this runner's vCPUs), not `auto`, whose answer changes with whether
      # psutil happens to be installed (it then counts physical cores).
      - run: cd src/backend && pytest -n 4 --dist loadfile
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobscraper

  scripts:
    name: Scraper Scripts
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobscraper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-dev.txt

      - run: pip install -r scripts/requirements.txt -r scripts/requirements-dev.txt

      - run: cd scripts && pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobscraper

  # The local enrichment worker (src/enricher). macOS because prod is a Mac:
  # the scripts lean on BSD stat, `sysctl kern.boottime` and plutil.
  enricher:
    name: Enricher
    timeout-minutes: 15
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the cutover tests look up the prod tag.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"

      # --locked also proves no root uv workspace has captured src/enricher.
      - run: cd src/enricher && uv sync --locked && uv run pytest

      # The sandboxed cutover + watcher e2e (no stack, no network: uv runs
      # offline from the cache the step above filled). It builds its fake prods
      # on a uv-MANAGED 3.12, like the real one (the runner may only have a
      # system 3.12). CO-REAL needs the tag enricher-prod-eeff1c9, hence
      # fetch-depth: 0 above.
      - run: uv python install 3.12 && bash e2e/run.sh enricher-cutover

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: enricher-cutover-artifacts
          path: e2e/enricher-cutover/artifacts/
          retention-days: 7
